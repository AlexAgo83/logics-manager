name: CI

# Split into parallel jobs instead of one monolithic per-OS run: the
# Windows-specific hangs and correctness bugs found while shipping 2.21.2
# (blocking readline()s with no real timeout, a lock that silently no-op'd
# on Windows, an unhandled OSError probing PATH) all live on the Python
# side. Isolating python-tests as its own matrix job means a Python-side
# problem no longer blocks the unrelated Node-side checks from reporting,
# and the jobs that don't need Windows coverage stay Ubuntu-only instead of
# paying for a second runner on every push.
#
# `scripts/ci-check.mjs` still runs everything serially in one pass, for
# local development (`npm run ci:check`) - keep the step list here in sync
# with it by hand; this workflow is the CI-parallel shape, not a replacement.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade coverage pytest ruff
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:assets
      - run: npm run check:changelog
      - run: node scripts/run-python.mjs -m logics_manager lint --require-status
      - run: node scripts/run-python.mjs -m logics_manager doctor packaging --metadata-only
      - run: node scripts/run-python.mjs -m logics_manager doctor
      - name: Logics flow sync close-eligible requests (must be a no-op)
        run: |
          git diff --exit-code -- logics/request || { echo "unexpected pre-existing diff under logics/request" >&2; exit 1; }
          node scripts/run-python.mjs -m logics_manager sync close-eligible-requests
          git diff --exit-code -- logics/request
      - run: node scripts/run-python.mjs -m logics_manager audit --legacy-cutoff-version 1.1.0 --group-by-doc
      - run: node scripts/run-python.mjs -m logics_manager audit --format json
      - run: npm run docs:check
      - run: npm run audit:ci
      - run: npm run check:viewer-host
      - run: npm run compile
      - run: npm run lint
      - run: npm run lint:logics
      - run: node scripts/run-python.mjs -m ruff check logics_manager tests/python scripts
      - run: node scripts/run-python.mjs scripts/check_function_length.py

  python-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade coverage pytest
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:assets
      - run: python -m coverage run --source=logics_manager -m pytest tests/python/ -q
      - name: Python coverage floor
        run: node scripts/check-python-coverage-floor.mjs

  node-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:assets
      - run: npm run compile
      - run: npm run test:coverage
      - run: npm run test:viewer-smoke
      - run: npm run test:smoke
      - run: npm run test:npm-cli

  package-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:assets
      - run: npm run compile
      - run: npm run package:ci
