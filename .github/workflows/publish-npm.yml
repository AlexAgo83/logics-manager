name: Publish npm

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Ensure tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_REF="${GITHUB_REF_NAME}"
          if [ "v${PACKAGE_VERSION}" != "${RELEASE_REF}" ]; then
            echo "Ref ${RELEASE_REF} does not match package.json version v${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Check npm version
        id: npm_version
        continue-on-error: true
        run: npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version

      - name: Publish to npm
        if: steps.npm_version.outcome != 'success'
        run: npm run publish:npm
