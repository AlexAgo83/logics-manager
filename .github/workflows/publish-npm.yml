name: Publish npm

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Ensure tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_REF="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RELEASE_REF="${{ github.event.workflow_run.head_branch }}"
          fi
          if [ "v${PACKAGE_VERSION}" != "${RELEASE_REF}" ]; then
            echo "Ref ${RELEASE_REF} does not match package.json version v${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm run publish:npm
