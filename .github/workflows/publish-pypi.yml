name: Publish PyPI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure tag matches package version
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          RELEASE_REF="${GITHUB_REF_NAME}"
          if [ "v${PACKAGE_VERSION}" != "${RELEASE_REF}" ]; then
            echo "Ref ${RELEASE_REF} does not match pyproject.toml version v${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate viewer assets
        run: npm run build:assets

      - name: Build distributions
        run: python -m build

      - name: Verify wheel ships complete viewer assets
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          media = [n for n in names if n.startswith("logics_manager/viewer_assets/media/")]
          viewer = [n for n in names if n.startswith("logics_manager/viewer_assets/viewer/")]
          assert media, f"{wheel} is missing logics_manager/viewer_assets/media"
          assert viewer, f"{wheel} is missing logics_manager/viewer_assets/viewer"
          print(f"{wheel}: {len(media)} media + {len(viewer)} viewer asset files")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: false
