name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # The tag points at a commit the CI workflow already validates on both
  # platforms (push on main), so re-running the full suite here doubled the
  # release wall clock for no new information. Gate on that CI run instead.
  await-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI success on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for CI workflow conclusion on ${GITHUB_SHA}..."
          missing=0
          for attempt in $(seq 1 60); do
            state=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow CI --commit "${GITHUB_SHA}" --limit 1 \
              --json status,conclusion \
              --jq 'if length == 0 then "missing" elif .[0].status != "completed" then "pending" else .[0].conclusion end')
            case "${state}" in
              success)
                echo "CI is green for ${GITHUB_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|startup_failure)
                echo "CI concluded '${state}' for ${GITHUB_SHA}; fix or rerun CI, then rerun this release." >&2
                exit 1
                ;;
              missing)
                missing=$((missing + 1))
                if [ "${missing}" -ge 9 ]; then
                  echo "No CI run found for ${GITHUB_SHA} after ~3 minutes. Push the commit to a branch so CI runs, then rerun this release." >&2
                  exit 1
                fi
                ;;
            esac
            echo "attempt ${attempt}: CI is ${state}"
            sleep 20
          done
          echo "Timed out waiting for CI on ${GITHUB_SHA}." >&2
          exit 1

  release:
    runs-on: ubuntu-latest
    needs:
      - await-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Resolve curated changelog
        id: release_changelog
        run: node scripts/release/resolve-release-changelog.mjs "${{ github.ref_name }}" --github-output "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npm run package

      - name: Create GitHub release (curated changelog)
        if: steps.release_changelog.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.release_changelog.outputs.body_path }}
          generate_release_notes: false
          files: artifacts/vscode/logics-manager-${{ steps.release_changelog.outputs.version }}.vsix

      - name: Create GitHub release (generated fallback)
        if: steps.release_changelog.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/vscode/logics-manager-${{ steps.release_changelog.outputs.version }}.vsix

  publish-npm:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    secrets: inherit

  publish-pypi:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-pypi.yml
    secrets: inherit
