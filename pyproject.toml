[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logics-manager"
version = "2.22.0"
description = "Canonical Logics CLI"
# item_678: without this the PyPI page carries no description and no history at all.
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
logics-manager = "logics_manager.cli:main"

[tool.setuptools]
packages = [
  "logics_manager",
  "logics_manager.flow",
  "logics_manager.viewer_assets",
  "logics_manager.viewer_assets.media",
  "logics_manager.viewer_assets.media.css",
  "logics_manager.viewer_assets.media.vendor",
  "logics_manager.viewer_assets.media.vendor.xterm",
  "logics_manager.viewer_assets.media.vendor.highlight",
  "logics_manager.viewer_assets.vendor",
  "logics_manager.viewer_assets.viewer",
  "logics_manager.skill_assets",
  "logics_manager.skill_assets.corpus",
]

[tool.setuptools.package-data]
logics_manager = [
  "statuses.json",
  "viewer_assets/media/*",
  "viewer_assets/media/css/*",
  "viewer_assets/media/vendor/xterm/*",
  "viewer_assets/media/vendor/highlight/*",
  "viewer_assets/vendor/*",
  "viewer_assets/viewer/*",
  "skill_assets/*/SKILL.md",
]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow, so it passes today and every future failure is a real
# defect rather than a style debate.
#
# F401 (unused import) is NOT enabled: this codebase re-exports on purpose --
# `assist.py` re-exports ~66 names from `assist_support` so existing call sites
# and monkeypatch targets keep working, and `tests/python/conftest.py` provides
# a shared import surface for the suite. Enabling it would report ~583 findings,
# nearly all of them intentional.
#
# I001 (import sorting) is NOT enabled: it would rewrite import blocks across
# the codebase for no defect.
select = [
  "E9",    # syntax and IO errors
  "F63",   # invalid comparisons
  "F7",    # syntax that is valid but wrong (break outside loop, ...)
  "F811",  # redefined while unused
  "F821",  # undefined name
  "F841",  # unused local variable
  "F541",  # f-string with no placeholders
  "PLE",   # pylint errors
]
